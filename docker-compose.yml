version: "3.8"

services:
  server-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: server-monitor:latest
    ports:
      - "5000:5000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app:rw
    restart: unless-stopped
