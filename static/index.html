<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Server Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="top-bar">
    <div class="top-card network-card">
      <div class="network-header">Network</div>
      <div class="network-row"><span>RX</span><strong id="rx-speed">0.0 MB/s</strong></div>
      <div class="network-row"><span>TX</span><strong id="tx-speed">0.0 MB/s</strong></div>
    </div>
  </div>

  <main class="dashboard">
    <section class="meter-card">
      <div class="gauge-wrap">
        <div id="cpuGauge" class="gauge" data-meter="cpu">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <g class="ticks"></g>
            <line class="needle" x1="100" y1="100" x2="174" y2="100" />
            <circle class="track" cx="100" cy="100" r="80" />
            <circle class="progress" cx="100" cy="100" r="80" />
          </svg>
          <div class="reading">
            <div class="value" id="cpu-reading">0</div>
            <div class="unit">%</div>
          </div>
        </div>
      </div>
      <div class="meter-title">CPU</div>
      <div id="cpu-name" class="cpu-name">Loading CPU...</div>
    </section>

    <section class="meter-card">
      <div class="gauge-wrap">
        <div id="memoryGauge" class="gauge" data-meter="memory">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <g class="ticks"></g>
            <line class="needle" x1="100" y1="100" x2="174" y2="100" />
            <circle class="track" cx="100" cy="100" r="80" />
            <circle class="progress" cx="100" cy="100" r="80" />
          </svg>
          <div class="reading">
            <div class="value" id="memory-reading">0</div>
            <div class="unit">%</div>
          </div>
        </div>
      </div>
      <div class="meter-title">Memory</div>
    </section>
  </main>

  <div id="disk-box" class="disk-box">HDD: Loading...</div>
  <div id="timestamp" class="timestamp">Loading...</div>

  <script src="/static/script.js"></script>
</body>
</html>
