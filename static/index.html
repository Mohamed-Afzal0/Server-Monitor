<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Server Monitor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <button id="info-button" class="info-button" type="button" aria-label="Open information" aria-controls="info-modal" aria-expanded="false">
    <span aria-hidden="true">i</span>
  </button>

  <div id="info-modal" class="info-modal" role="dialog" aria-modal="true" aria-labelledby="info-title" hidden>
    <div class="info-window">
      <button id="info-close" class="info-close" type="button" aria-label="Close information">&times;</button>
      <div class="info-logo" aria-hidden="true">i</div>
      <h1 id="info-title">Server Monitor</h1>
      <p class="info-description">A real-time dashboard for CPU, memory, disk, and network performance.</p>
      <div class="info-divider" aria-hidden="true"></div>
      <div class="author-info">
        <strong>Seyed Fazee Mohamed Afzal</strong>
        <div class="author-links">
          <a href="https://github.com/Mohamed-Afzal0" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://www.linkedin.com/in/mohamed-afzal-0b7372305/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
          <a href="https://mohamed-afzal-lovat.vercel.app/" target="_blank" rel="noopener noreferrer">Portfolio</a>
        </div>
      </div>
    </div>
  </div>

  <main class="dashboard">
    <section class="meter-card">
      <div class="gauge-wrap">
        <div id="cpuGauge" class="gauge" data-meter="cpu">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <g class="ticks"></g>
            <line class="needle" x1="100" y1="100" x2="174" y2="100" />
            <circle class="track" cx="100" cy="100" r="80" />
            <circle class="progress" cx="100" cy="100" r="80" />
          </svg>
          <div class="reading">
            <div class="value" id="cpu-reading">0</div>
            <div class="unit">%</div>
          </div>
        </div>
      </div>
      <div id="cpu-title" class="meter-title">CPU</div>
      <div id="cpu-name" class="cpu-name">Loading CPU...</div>
    </section>

    <div class="center-stack">
      <div class="brand-title" aria-label="Server Monitor">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Server Monitor</span>
      </div>

      <section class="network-card" aria-label="Network usage">
        <div class="network-header">Network</div>
        <div class="network-row"><span>RX</span><strong id="rx-speed">0.0 MB/s</strong></div>
        <div class="network-row"><span>TX</span><strong id="tx-speed">0.0 MB/s</strong></div>
      </section>

      <section id="disk-box" class="disk-box" aria-label="Hard drive usage">
        <div class="disk-title">HDD</div>
        <div class="disk-usage"><span id="disk-used">0.0</span> / <span id="disk-total">0.0</span> GB</div>
        <div id="disk-percent" class="disk-percent">0%</div>
      </section>
    </div>

    <section class="meter-card">
      <div class="gauge-wrap">
        <div id="memoryGauge" class="gauge" data-meter="memory">
          <svg viewBox="0 0 200 200" aria-hidden="true">
            <g class="ticks"></g>
            <line class="needle" x1="100" y1="100" x2="174" y2="100" />
            <circle class="track" cx="100" cy="100" r="80" />
            <circle class="progress" cx="100" cy="100" r="80" />
          </svg>
          <div class="reading">
            <div class="value" id="memory-reading">0</div>
            <div class="unit">%</div>
          </div>
        </div>
      </div>
      <div id="memory-title" class="meter-title">Memory</div>
    </section>
  </main>

  <div id="timestamp" class="timestamp">Loading...</div>

  <script src="/static/script.js"></script>
</body>
</html>
